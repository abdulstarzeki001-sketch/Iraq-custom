name: Cinematic React build
on:
  push:
    branches: [main]
    paths:
      - 'creative/**'
      - 'cinematic/**'
      - '.github/workflows/cinematic-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: creative
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        working-directory: creative
        run: npm run check
      - name: Verify legacy pages and compiled shell
        run: node cinematic/smoke.mjs
      - name: Commit production standalone app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creative-app
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish production cinematic React bundle [skip ci]'
            git push
          fi
